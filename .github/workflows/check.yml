name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format, test generated fixtures, and lint
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build portable package without launching it
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoEnhancer-portable
          path: dist/*
