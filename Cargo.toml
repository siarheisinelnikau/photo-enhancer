[package]
name = "photo-enhancer"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Local, deterministic photo enhancement for Windows"
repository = "https://github.com/siarheisinelnikau/photo-enhancer"

[dependencies]
anyhow = "1.0"
egui = { version = "=0.33.3", features = ["default_fonts"] }
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "links", "x11"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
softbuffer = { version = "=0.4.8", default-features = false }
bytemuck = "1.25"
dirs = "6.0"
ron = "0.11"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
moxcms = "=0.8.1"
png = "0.18.1"
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
rust-auto-updator = { path = "../rust-auto-updator/crates/rust-auto-updator" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_System_Threading"] }

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[[bin]]
name = "PhotoEnhancer"
path = "src/main.rs"

