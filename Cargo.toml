[package]
name = "photo-enhancer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local, deterministic photo enhancement for Windows"
repository = "https://github.com/siarheisinelnikau/photo-enhancer"

[dependencies]
anyhow = "1.0"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
png = "0.18.1"
rfd = "0.15.4"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
self-replace = "1.5"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11"] }

[[bin]]
name = "PhotoEnhancer"
path = "src/main.rs"

